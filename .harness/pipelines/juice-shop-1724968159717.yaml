pipeline:
  identifier: Build_kunalnano_juice_shop_1724968164902
  name: Build juice-shop
  orgIdentifier: TPMLabs
  projectIdentifier: testal
  properties:
    ci:
      codebase:
        build: <+input>
        connectorRef: account.Github_OAuth_1720712151481
        repoName: kunalnano/juice-shop
  stages:
    - stage:
        identifier: build
        name: build
        type: CI
        spec:
          caching:
            enabled: true
          cloneCodebase: true
          execution:
            steps:
              - step:
                  identifier: updateNode
                  name: Update Node.js Version
                  type: Run
                  spec:
                    shell: Sh
                    command: |-
                      # Download Node.js
                      curl -fsSL https://nodejs.org/dist/v18.3.0/node-v18.3.0-linux-x64.tar.xz -o node-v18.3.0-linux-x64.tar.xz
                      # Extract the archive
                      tar -xJf node-v18.3.0-linux-x64.tar.xz
                      # Navigate to the extracted directory
                      cd node-v18.3.0-linux-x64
                      # Add the extracted node and npm binaries to PATH
                      export PATH=$PWD/bin:$PATH
                      # Verify Node.js version
                      node -v
                      npm -v
              - step:
                  identifier: installdependencies
                  name: Install dependencies
                  type: Run
                  spec:
                    shell: Sh
                    command: |-
                      npm install
                      npm install -g @angular/cli
                    timeout: ""
              - step:
                  identifier: test
                  name: Test
                  type: Run
                  spec:
                    shell: Sh
                    command: npm run test
                    timeout: ""
              - step:
                  identifier: lint
                  name: Lint
                  type: Run
                  spec:
                    shell: Sh
                    command: npm run lint
                    timeout: ""
              - step:
                  identifier: dockerbuild
                  name: Docker Build
                  type: BuildAndPushDockerRegistry
                  spec:
                    caching: true
                    connectorRef: <+input>
                    repo: hello/world
                    tags:
                      - latest
                    timeout: ""
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
